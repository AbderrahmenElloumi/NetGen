[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netgen"
version = "0.1.0"
description = "Dataset generator from any network traffic format"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "scapy>=2.5.0",
]

[project.optional-dependencies]
autoencoder = ["torch>=2.0.0"]
benchmark = ["scikit-learn>=1.3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
netgen = "netgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The branch-coverage gate: the capture reader and flow aggregation together
# must reach 90%. `--no-cov` skips it when running a subset of the tests.
addopts = [
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "slow: a slow test; deselect with -m \"not slow\" while iterating",
]

# The gated modules are named by path: `--cov=<module>` imports the package
# before the tests run and breaks the numpy import.
[tool.coverage.run]
branch = true
include = ["src/netgen/readers/capture.py", "src/netgen/aggregation.py"]
# The repository mount is read-only in the test services.
data_file = "/tmp/.coverage"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# A bind mount from a Windows host shows every file as executable.
ignore = ["EXE002"]

[tool.mypy]
files = ["src", "data/samples"]

# pandas ships no type hints and the lock holds no pandas-stubs: pandas is Any.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

# Strict on the new core modules. `strict` itself is a global-only option.
[[tool.mypy.overrides]]
module = [
    "netgen.errors",
    "netgen.record",
    "netgen.table",
    "netgen.stages",
    "netgen.stages.*",
    "netgen.preparation",
    "netgen.report",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unused_ignores = true
