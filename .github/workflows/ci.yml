name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The check service writes out/ as the compose user 1000:1000; the
      # checkout belongs to the runner's user.
      - name: Prepare out/ for the check service
        run: mkdir -p out && sudo chown 1000:1000 out
      - name: test
        run: docker compose run --rm test
      - name: test-floor
        run: docker compose run --rm test-floor
      - name: check
        run: docker compose run --rm check
